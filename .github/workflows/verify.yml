name: Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      renovate: ${{ steps.filter.outputs.renovate }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Classify changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            # Checkout uses the PR merge commit; its first parent is the base branch.
            changed_files="$(git diff --name-only HEAD^1 HEAD)"
            if printf '%s\n' "$changed_files" | grep -qE '^(renovate\.json|\.github/workflows/)'; then
              echo "renovate=true" >> "$GITHUB_OUTPUT"
            else
              echo "renovate=false" >> "$GITHUB_OUTPUT"
            fi
            if [[ -n "$changed_files" ]] && ! printf '%s\n' "$changed_files" | grep -qvE '^(docs/|[^/]+\.md$|\.remarkrc\.mjs$|\.github/pull_request_template\.md$|\.github/ISSUE_TEMPLATE/)'; then
              echo "docs_only=true" >> "$GITHUB_OUTPUT"
            else
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "renovate=true" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  renovate:
    needs: changes
    if: needs.changes.outputs.renovate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Renovate configuration
        uses: docker://ghcr.io/renovatebot/renovate:44.236.4@sha256:c00542ee2c0ca5623fd9e98b3878ae175ddc7b6a695c7bd04aceba8a9b44d0e4
        with:
          entrypoint: renovate-config-validator
          args: --strict --no-global renovate.json

  docs-verify:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+, Node.js, and pnpm
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run documentation and secret checks
        run: |
          vp run --no-cache check:docs
          vp run --no-cache test:docs
          vp fmt --check
          vp run --no-cache check:secrets
          vp run --no-cache test:ci

  build:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+, Node.js, and pnpm
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build workspace and check docs
        env:
          TMPDIR: ${{ runner.temp }}
        run: vp run --no-cache ready:build

      - name: Upload build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-outputs
          retention-days: 1
          include-hidden-files: true
          path: |
            app/dist
            app/.cloudflare
            app/src/routeTree.gen.ts
            tooling/storybook/dist

  static-and-security:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-outputs

      - name: Set up Vite+, Node.js, and pnpm
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run static and security checks
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          vp run --no-cache --ignore-depends-on ready:static
          vp run --no-cache check:security

  package-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-outputs

      - name: Set up Vite+, Node.js, and pnpm
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run package unit and component tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: >-
          vp run --no-cache --parallel --concurrency-limit 2
          --filter '@merit/*' --filter '!@merit/storybook' test
          --reporter=default --reporter=github-actions --reporter=json
          --outputFile.json=.vitest-report.json

      - name: Publish test summary
        if: always()
        run: vp run --no-cache ci:summary "Package tests" --scan-vitest .vitest-report.json

  storybook-vitest:
    needs: build
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+, Node.js, and pnpm
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run Storybook interaction and accessibility tests
        env:
          TMPDIR: ${{ runner.temp }}
          MERIT_CI_REPORT_DIR: ${{ runner.temp }}/ci-reports
        run: |
          mkdir -p "$MERIT_CI_REPORT_DIR"
          vp run --no-cache @merit/storybook#test \
            --reporter=default --reporter=github-actions --reporter=json \
            --outputFile.json="$MERIT_CI_REPORT_DIR/vitest.json"

      - name: Publish test summary
        if: always()
        env:
          MERIT_CI_REPORT_DIR: ${{ runner.temp }}/ci-reports
        run: vp run --no-cache ci:summary "Storybook Vitest"

  integration:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-outputs

      - name: Set up Vite+, Node.js, and pnpm
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Start PostgreSQL and Mailpit
        run: docker compose up -d --wait

      - name: Run database integration tests
        env:
          TMPDIR: ${{ runner.temp }}
          MERIT_CI_REPORT_DIR: ${{ runner.temp }}/ci-reports
        run: |
          mkdir -p "$MERIT_CI_REPORT_DIR"
          vp run --no-cache @merit/app#test:integration \
            --reporter=default --reporter=github-actions --reporter=json \
            --outputFile.json="$MERIT_CI_REPORT_DIR/vitest.json"

      - name: Publish test summary
        if: always()
        env:
          MERIT_CI_REPORT_DIR: ${{ runner.temp }}/ci-reports
        run: vp run --no-cache ci:summary "Integration tests"

      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color > "$RUNNER_TEMP/services.log" 2>&1

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-failure-integration
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/services.log
            ${{ runner.temp }}/ci-reports

      - name: Stop test services
        if: always()
        run: docker compose down --volumes

  tooling-self-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-outputs

      - name: Set up Vite+, Node.js, and pnpm
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run tooling self-tests and source-modifying probes
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          vp run --no-cache ready:tooling
          vp run --no-cache test:checks

  browser-tooling:
    needs: build
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+, Node.js, and pnpm
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run shared browser fixture tests
        env:
          TMPDIR: ${{ runner.temp }}
          MERIT_CI_REPORT_DIR: ${{ runner.temp }}/ci-reports
        run: |
          mkdir -p "$MERIT_CI_REPORT_DIR"
          vp run --no-cache test:browser:tooling:all

      - name: Publish test summary
        if: always()
        env:
          MERIT_CI_REPORT_DIR: ${{ runner.temp }}/ci-reports
        run: vp run --no-cache ci:summary "Tooling browser fixtures"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-failure-browser-tooling
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/merit-browser-results
            ${{ runner.temp }}/ci-reports

  browser-storybook:
    needs: build
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-outputs

      - name: Set up Vite+, Node.js, and pnpm
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run Storybook browser tests
        env:
          TMPDIR: ${{ runner.temp }}
          MERIT_CI_REPORT_DIR: ${{ runner.temp }}/ci-reports
          MERIT_STORYBOOK_PREBUILT: "1"
        run: |
          mkdir -p "$MERIT_CI_REPORT_DIR"
          vp run --no-cache test:browser:stories:all --shard=${{ matrix.shard }}

      - name: Publish test summary
        if: always()
        env:
          MERIT_CI_REPORT_DIR: ${{ runner.temp }}/ci-reports
        run: vp run --no-cache ci:summary "Storybook browser (${{ matrix.shard }})"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-failure-storybook-${{ strategy.job-index }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/merit-storybook-results
            ${{ runner.temp }}/ci-reports

  browser-demo:
    needs: build
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    services:
      postgres:
        image: postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
        env:
          POSTGRES_USER: merit
          POSTGRES_PASSWORD: merit
          POSTGRES_DB: merit
        options: >-
          --health-cmd "pg_isready -U merit -d merit"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-outputs

      - name: Set up Vite+, Node.js, and pnpm
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Forward loopback PostgreSQL port to service container
        run: |
          node -e '
            const net = require("node:net");
            net.createServer((client) => {
              const upstream = net.connect(5432, "postgres");
              client.pipe(upstream);
              upstream.pipe(client);
              client.on("error", () => upstream.destroy());
              upstream.on("error", () => client.destroy());
            }).listen(55432, "127.0.0.1");
          ' </dev/null >/tmp/proxy.log 2>&1 &
          ready=0
          for _ in $(seq 1 30); do
            if node -e 'require("node:net").connect(55432, "127.0.0.1").on("connect", () => process.exit(0)).on("error", () => process.exit(1))' 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [[ "$ready" -ne 1 ]]; then
            cat /tmp/proxy.log || true
            exit 1
          fi

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run demo browser tests
        env:
          TMPDIR: ${{ runner.temp }}
          MERIT_CI_REPORT_DIR: ${{ runner.temp }}/ci-reports
        run: |
          mkdir -p "$MERIT_CI_REPORT_DIR"
          vp run --no-cache test:browser:app:all --shard=${{ matrix.shard }}

      - name: Publish test summary
        if: always()
        env:
          MERIT_CI_REPORT_DIR: ${{ runner.temp }}/ci-reports
        run: vp run --no-cache ci:summary "Demo browser (${{ matrix.shard }})"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-failure-demo-${{ strategy.job-index }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/merit-demo-browser-*
            ${{ runner.temp }}/ci-reports
            /tmp/proxy.log

  browser-workspace:
    needs: build
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    services:
      postgres:
        image: postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
        env:
          POSTGRES_USER: merit
          POSTGRES_PASSWORD: merit
          POSTGRES_DB: merit
        options: >-
          --health-cmd "pg_isready -U merit -d merit"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.30.4@sha256:5a49a77c5bdbe7c5474450b4f46348d09949df3695257729c93a30369382d4f6
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-outputs

      - name: Set up Vite+, Node.js, and pnpm
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Forward loopback service ports to service containers
        run: |
          node -e '
            const net = require("node:net");
            for (const [listenPort, targetHost, targetPort] of [[55432, "postgres", 5432], [8025, "mailpit", 8025]]) {
              net.createServer((client) => {
                const upstream = net.connect(targetPort, targetHost);
                client.pipe(upstream);
                upstream.pipe(client);
                client.on("error", () => upstream.destroy());
                upstream.on("error", () => client.destroy());
              }).listen(listenPort, "127.0.0.1");
            }
          ' </dev/null >/tmp/proxy.log 2>&1 &
          ready=0
          for _ in $(seq 1 30); do
            if node -e '
              const net = require("node:net");
              Promise.all([55432, 8025].map((port) => new Promise((resolve, reject) => {
                const socket = net.connect(port, "127.0.0.1");
                socket.on("connect", () => { socket.destroy(); resolve(); });
                socket.on("error", reject);
              }))).then(() => process.exit(0)).catch(() => process.exit(1));
            ' 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [[ "$ready" -ne 1 ]]; then
            cat /tmp/proxy.log || true
            exit 1
          fi

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run persisted workspace browser tests
        env:
          TMPDIR: ${{ runner.temp }}
          MERIT_CI_REPORT_DIR: ${{ runner.temp }}/ci-reports
        run: |
          mkdir -p "$MERIT_CI_REPORT_DIR"
          vp run --no-cache @merit/app#test:workspace:all --shard=${{ matrix.shard }}

      - name: Publish test summary
        if: always()
        env:
          MERIT_CI_REPORT_DIR: ${{ runner.temp }}/ci-reports
        run: vp run --no-cache ci:summary "Workspace browser (${{ matrix.shard }})"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-failure-workspace-${{ strategy.job-index }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/merit-workspace-browser-*
            ${{ runner.temp }}/ci-reports
            /tmp/proxy.log

  verify:
    if: always()
    needs:
      - changes
      - renovate
      - docs-verify
      - build
      - static-and-security
      - package-tests
      - storybook-vitest
      - integration
      - tooling-self-tests
      - browser-tooling
      - browser-storybook
      - browser-demo
      - browser-workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize verification outcome
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node -e '
            const fs = require("node:fs");
            const needs = JSON.parse(process.env.NEEDS_JSON);
            const lines = ["### Verification Gate", "", "| Job | Outcome |", "| --- | --- |"];
            const failed = [];
            for (const [name, info] of Object.entries(needs)) {
