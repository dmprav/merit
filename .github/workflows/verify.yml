name: Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect Renovate configuration changes
        id: renovate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            # Checkout uses the PR merge commit; its first parent is the base branch.
            changed_files="$(git diff --name-only HEAD^1 HEAD -- renovate.json .github/workflows/verify.yml)"
          else
            changed_files=manual
          fi
          if [[ -n "$changed_files" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Renovate configuration
        if: steps.renovate.outputs.changed == 'true'
        uses: docker://ghcr.io/renovatebot/renovate:44.236.4@sha256:c00542ee2c0ca5623fd9e98b3878ae175ddc7b6a695c7bd04aceba8a9b44d0e4
        with:
          entrypoint: renovate-config-validator
          args: --strict --no-global renovate.json

      - name: Set up Vite+, Node.js, and pnpm
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Start PostgreSQL and Mailpit
        run: docker compose up -d --wait

      - name: Run required PR verification
        env:
          TMPDIR: ${{ runner.temp }}
        run: vp run --no-cache ready:ci 2>&1 | tee "$RUNNER_TEMP/verify.log"

      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color > "$RUNNER_TEMP/services.log" 2>&1

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-failure
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/verify.log
            ${{ runner.temp }}/services.log
            ${{ runner.temp }}/merit-browser-results
            ${{ runner.temp }}/merit-storybook-results
            ${{ runner.temp }}/merit-demo-browser-*
            ${{ runner.temp }}/merit-workspace-browser-*

      - name: Stop test services
        if: always()
        run: docker compose down --volumes
