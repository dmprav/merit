name: Verify

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      renovate: ${{ steps.filter.outputs.renovate }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
      renovate_only: ${{ steps.filter.outputs.renovate_only }}
      full_run: ${{ steps.filter.outputs.full_run }}
      run_app: ${{ steps.filter.outputs.run_app }}
      run_storybook: ${{ steps.filter.outputs.run_storybook }}
      run_tooling: ${{ steps.filter.outputs.run_tooling }}
      run_package_tests: ${{ steps.filter.outputs.run_package_tests }}
      package_filters: ${{ steps.filter.outputs.package_filters }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tooling/verification/ci-changes.mjs

  renovate:
    needs: changes
    if: needs.changes.outputs.renovate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Renovate configuration
        uses: docker://ghcr.io/renovatebot/renovate:44.236.4@sha256:c00542ee2c0ca5623fd9e98b3878ae175ddc7b6a695c7bd04aceba8a9b44d0e4
        with:
          entrypoint: renovate-config-validator
          args: --strict --no-global renovate.json

  docs-verify:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Run documentation and secret checks
        run: |
          vp run --no-cache check:docs
          vp run --no-cache test:docs
          vp fmt --check
          vp run --no-cache check:secrets
          vp run --no-cache test:ci

  security-checks:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.renovate_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Run security checks
        env:
          TMPDIR: ${{ runner.temp }}
        run: vp run --no-cache check:security

  build:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.renovate_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Build workspace and check docs
        env:
          TMPDIR: ${{ runner.temp }}
        run: vp run --no-cache ready:build

      - name: Upload build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-outputs
          retention-days: 1
          include-hidden-files: true
          path: |
            app/dist
            app/.cloudflare
            app/src/routeTree.gen.ts
            tooling/storybook/dist

  static-checks:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          download-build: "true"

      - name: Run static checks
        env:
          TMPDIR: ${{ runner.temp }}
        run: vp run --no-cache --ignore-depends-on ready:static

  package-tests:
    needs: [changes, build]
    if: needs.changes.outputs.run_package_tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          download-build: "true"

      - name: Run package unit and component tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: >-
          vp run --no-cache --parallel --concurrency-limit 2
          ${{ needs.changes.outputs.package_filters }} test
          --reporter=default --reporter=github-actions --reporter=json
          --outputFile.json=.vitest-report.json

      - name: Publish test summary
        if: always()
        run: vp run --no-cache ci:summary "Package tests" --scan-vitest .vitest-report.json

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-failure-package-tests
          retention-days: 7
          if-no-files-found: ignore
          path: "**/.vitest-report.json"

  storybook-vitest:
    needs: changes
    if: needs.changes.outputs.full_run == 'true' || needs.changes.outputs.run_storybook == 'true'
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Run Storybook interaction and accessibility tests
        env:
          HOME: /root
          TMPDIR: ${{ runner.temp }}
          MERIT_CI_REPORT_DIR: /tmp/ci-reports
        run: |
          mkdir -p "$MERIT_CI_REPORT_DIR"
          vp run --no-cache @merit/storybook#test \
            --reporter=default --reporter=github-actions --reporter=json \
            --outputFile.json="$MERIT_CI_REPORT_DIR/vitest.json"

      - name: Publish test summary
        if: always()
        env:
          MERIT_CI_REPORT_DIR: /tmp/ci-reports
        run: vp run --no-cache ci:summary "Storybook Vitest"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-failure-storybook-vitest
          retention-days: 7
          if-no-files-found: ignore
          path: /tmp/ci-reports

  integration:
    needs: [changes, build]
    if: needs.changes.outputs.full_run == 'true' || needs.changes.outputs.run_app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          download-build: "true"

      - name: Start PostgreSQL and Mailpit
        run: docker compose up -d --wait

      - name: Run database integration tests
        env:
          TMPDIR: ${{ runner.temp }}
          MERIT_CI_REPORT_DIR: ${{ runner.temp }}/ci-reports
        run: |
          mkdir -p "$MERIT_CI_REPORT_DIR"
          vp run --no-cache @merit/app#test:integration \
            --reporter=default --reporter=github-actions --reporter=json \
            --outputFile.json="$MERIT_CI_REPORT_DIR/vitest.json"

      - name: Publish test summary
        if: always()
        env:
          MERIT_CI_REPORT_DIR: ${{ runner.temp }}/ci-reports
        run: vp run --no-cache ci:summary "Integration tests"

      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color > "$RUNNER_TEMP/services.log" 2>&1

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-failure-integration
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/services.log
            ${{ runner.temp }}/ci-reports

      - name: Stop test services
        if: always()
        run: docker compose down --volumes

  tooling-self-tests:
    needs: changes
    if: needs.changes.outputs.full_run == 'true' || needs.changes.outputs.run_tooling == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Run tooling self-tests and source-modifying probes
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          vp run --no-cache ready:tooling
          vp run --no-cache test:checks

  browser-tooling:
    needs: changes
    if: needs.changes.outputs.full_run == 'true' || needs.changes.outputs.run_tooling == 'true'
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Run shared browser fixture tests
        env:
          HOME: /root
          TMPDIR: ${{ runner.temp }}
          MERIT_CI_REPORT_DIR: /tmp/ci-reports
        run: |
          mkdir -p "$MERIT_CI_REPORT_DIR"
          vp run --no-cache test:browser:tooling:all

      - name: Publish test summary
        if: always()
        env:
          MERIT_CI_REPORT_DIR: /tmp/ci-reports
        run: vp run --no-cache ci:summary "Tooling browser fixtures"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-failure-browser-tooling
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/merit-browser-results
            /tmp/ci-reports

  browser-storybook:
    needs: [changes, build, static-checks]
    if: needs.changes.outputs.full_run == 'true' || needs.changes.outputs.run_storybook == 'true'
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          download-build: "true"

      - name: Run Storybook browser tests
        env:
          HOME: /root
          TMPDIR: ${{ runner.temp }}
          MERIT_CI_REPORT_DIR: /tmp/ci-reports
          MERIT_STORYBOOK_PREBUILT: "1"
        run: |
          mkdir -p "$MERIT_CI_REPORT_DIR"
          vp run --no-cache test:browser:stories:all --shard=${{ matrix.shard }}

      - name: Publish test summary
        if: always()
        env:
          MERIT_CI_REPORT_DIR: /tmp/ci-reports
        run: vp run --no-cache ci:summary "Storybook browser (${{ matrix.shard }})"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-failure-storybook-${{ strategy.job-index }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/merit-storybook-results
            /tmp/ci-reports

  browser-demo:
    needs: [changes, build, static-checks]
    if: needs.changes.outputs.full_run == 'true' || needs.changes.outputs.run_app == 'true'
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    services:
      postgres:
        image: postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
        env:
          POSTGRES_USER: merit
          POSTGRES_PASSWORD: merit
          POSTGRES_DB: merit
        options: >-
          --health-cmd "pg_isready -U merit -d merit"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          download-build: "true"

      - name: Forward loopback PostgreSQL port to service container
        uses: ./.github/actions/forward-service-ports
        with:
          forwards: "55432:postgres:5432"

      - name: Run demo browser tests
        env:
          HOME: /root
          TMPDIR: ${{ runner.temp }}
          MERIT_CI_REPORT_DIR: /tmp/ci-reports
        run: |
          mkdir -p "$MERIT_CI_REPORT_DIR"
          vp run --no-cache test:browser:app:all --shard=${{ matrix.shard }}

      - name: Publish test summary
        if: always()
        env:
          MERIT_CI_REPORT_DIR: /tmp/ci-reports
        run: vp run --no-cache ci:summary "Demo browser (${{ matrix.shard }})"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-failure-demo-${{ strategy.job-index }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/merit-demo-browser-*
            /tmp/ci-reports
            /tmp/proxy.log

  browser-workspace:
    needs: [changes, build, static-checks]
    if: needs.changes.outputs.full_run == 'true' || needs.changes.outputs.run_app == 'true'
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    services:
      postgres:
        image: postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
        env:
          POSTGRES_USER: merit
          POSTGRES_PASSWORD: merit
          POSTGRES_DB: merit
        options: >-
          --health-cmd "pg_isready -U merit -d merit"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.30.4@sha256:5a49a77c5bdbe7c5474450b4f46348d09949df3695257729c93a30369382d4f6
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          download-build: "true"

      - name: Forward loopback service ports to service containers
        uses: ./.github/actions/forward-service-ports
        with:
          forwards: "55432:postgres:5432,8025:mailpit:8025"

      - name: Run persisted workspace browser tests
        env:
          HOME: /root
          TMPDIR: ${{ runner.temp }}
          MERIT_CI_REPORT_DIR: /tmp/ci-reports
        run: |
          mkdir -p "$MERIT_CI_REPORT_DIR"
          vp run --no-cache @merit/app#test:workspace:all --shard=${{ matrix.shard }}

      - name: Publish test summary
        if: always()
        env:
          MERIT_CI_REPORT_DIR: /tmp/ci-reports
        run: vp run --no-cache ci:summary "Workspace browser (${{ matrix.shard }})"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-failure-workspace-${{ strategy.job-index }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/merit-workspace-browser-*
            /tmp/ci-reports
            /tmp/proxy.log

  verify:
    if: always()
    needs:
      - changes
      - renovate
      - docs-verify
      - security-checks
      - build
      - static-checks
      - package-tests
      - storybook-vitest
      - integration
      - tooling-self-tests
      - browser-tooling
      - browser-storybook
      - browser-demo
      - browser-workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize verification outcome
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node -e '
            const fs = require("node:fs");
            const needs = JSON.parse(process.env.NEEDS_JSON);
            const lines = ["### Verification Gate", "", "| Job | Outcome |", "| --- | --- |"];
            const failed = [];
            for (const [name, info] of Object.entries(needs)) {
              lines.push(`| ${name} | ${info.result} |`);
              if (info.result !== "success" && info.result !== "skipped") {
                failed.push(`${name}: ${info.result}`);
              }
            }
            const ranMain = needs.build?.result === "success";
            const ranDocs = needs["docs-verify"]?.result === "success";
            const ranRenovateOnly =
              needs.changes?.outputs?.renovate_only === "true" &&
              needs.renovate?.result === "success";
            if (needs.changes?.result !== "success") {
              failed.push("changes did not succeed");
            }
            if (!ranMain && !ranDocs && !ranRenovateOnly) {
              failed.push("no verification path ran");
            }
            const summary = `${lines.join("\n")}\n`;
            console.log(summary);
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            }
            if (failed.length > 0) {
              console.error(`Verification failed: ${failed.join(", ")}`);
              process.exit(1);
            }
          '
