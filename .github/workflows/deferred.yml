name: Deferred verification

# Runs every stage of the `ready` milestone, including the suites deferred from the required
# PR gate, to measure their reliability on CI. Not a required check.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deferred-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+, Node.js, and pnpm
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Read Playwright version
        id: playwright
        run: |
          version="$(pnpm --filter @merit/test-support exec playwright --version | awk '{print $2}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @merit/test-support exec playwright install --with-deps chromium firefox webkit

      # Saved before verification so a failing run still reuses the download.
      - name: Save Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}

      - name: Install Playwright system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @merit/test-support exec playwright install-deps chromium firefox webkit

      - name: Start PostgreSQL and Mailpit
        run: docker compose up -d --wait

      # The `ready` stages run one at a time, each after a failed stage too, so one
      # failure cannot hide the result of another. Stages and order follow `ready`.
      - name: Build
        id: build
        env:
          TMPDIR: ${{ runner.temp }}
        run: vp run --no-cache ready:build 2>&1 | tee "$RUNNER_TEMP/verify.log"

      - name: Static checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          TMPDIR: ${{ runner.temp }}
          MERIT_BROWSER_RETRIES: "2"
        run: vp run --no-cache --ignore-depends-on ready:static 2>&1 | tee -a "$RUNNER_TEMP/verify.log"

      - name: Package tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          TMPDIR: ${{ runner.temp }}
          MERIT_BROWSER_RETRIES: "2"
        run: vp run --no-cache --ignore-depends-on ready:tests 2>&1 | tee -a "$RUNNER_TEMP/verify.log"

      - name: Runtime suites
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          TMPDIR: ${{ runner.temp }}
          MERIT_BROWSER_RETRIES: "2"
        run: vp run --no-cache --ignore-depends-on ready:runtime 2>&1 | tee -a "$RUNNER_TEMP/verify.log"

      - name: Tooling self-tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          TMPDIR: ${{ runner.temp }}
          MERIT_BROWSER_RETRIES: "2"
        run: vp run --no-cache --ignore-depends-on ready:tooling 2>&1 | tee -a "$RUNNER_TEMP/verify.log"

      - name: Security checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          TMPDIR: ${{ runner.temp }}
          MERIT_BROWSER_RETRIES: "2"
        run: vp run --no-cache --ignore-depends-on check:security 2>&1 | tee -a "$RUNNER_TEMP/verify.log"

      - name: Source-modifying probes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          TMPDIR: ${{ runner.temp }}
          MERIT_BROWSER_RETRIES: "2"
        run: vp run --no-cache --ignore-depends-on ready 2>&1 | tee -a "$RUNNER_TEMP/verify.log"

      - name: Collect service logs
        if: always()
        run: docker compose logs --no-color > "$RUNNER_TEMP/services.log" 2>&1

      # Uploaded on success too: passing runs can contain flaky retries.
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deferred-verification
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/verify.log
            ${{ runner.temp }}/services.log
            ${{ runner.temp }}/merit-browser-results
            ${{ runner.temp }}/merit-storybook-results
            ${{ runner.temp }}/merit-demo-browser-*
            ${{ runner.temp }}/merit-workspace-browser-*

      - name: Stop test services
        if: always()
        run: docker compose down --volumes
