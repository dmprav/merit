name: Set up Merit workspace
description: Check out source, optionally download build outputs, set up Vite+/Node/pnpm, and install dependencies.

inputs:
  download-build:
    description: Whether to download the build-outputs artifact
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download build outputs
      if: ${{ inputs.download-build == 'true' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: build-outputs

    - name: Set up Vite+, Node.js, and pnpm
      uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        node-version-file: .node-version
        cache: true
        run-install: false

    - name: Install dependencies
      shell: bash
      run: vp install --frozen-lockfile
