# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US
tone_instructions: >
  Be concise and direct. Ground feedback in repository precedents, guides, and
  domain concepts, naming the concrete fix. Do not comment on formatting or
  rules already enforced by oxlint, oxfmt, stylelint, remark, or fallow.

reviews:
  profile: chill
  # Keep PR descriptions clean because Merit squash-merges them as commit messages.
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  abort_on_close: true

  path_filters:
    - "!**/routeTree.gen.ts"
    - "!pnpm-lock.yaml"
    - "!tooling/storybook/snapshots/**"
    - "!**/dist/**"
    - "!**/coverage/**"

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"

  path_instructions:
    - path: "capabilities/*/business/**"
      instructions: |
        - Business rules, authorization checks, domain invariants, revision/conflict handling, and transaction/lock ordering belong here rather than in `web/`, `interfaces/`, or `app/`.
        - Keep domain terminology consistent with `docs/domain/concepts.md` and the owning workflow in `docs/workflows/`.
        - Verify persistence commands validate/decode stored JSON projections explicitly and record authorship/audit history together with state changes.
        - Flag abstractions with a single use and no stated requirement, or helpers/fixtures that duplicate existing repository utilities.

    - path: "capabilities/access/**"
      instructions: |
        - Business rules, authorization predicates, and invariants belong here rather than in `interfaces/` or `app/`.
        - Verify authorization changes are enforced across all callers and transports, and check that tenant/workspace isolation cannot be bypassed.

    - path: "capabilities/*/web/**"
      instructions: |
        - Enforce `docs/guides/web-features.md` layer ownership:
          - `views/` present workflow state and invoke controller actions; flag record fetching, query cache mutations, or command/revision baseline construction inside views.
          - `controllers/` own drafts (`@merit/drafts`), revision baselines, save commands, conflict/recovery state, and Undo; flag direct imports of concrete `data/` adapters, Start server functions, or `views/`.
          - `data/` owns transport normalization, query keys, cancellation, and cache updates.
        - Check React Compiler compatibility (`tooling/react-compiler.ts`): avoid dynamic hook calls (`obj.useHook()`), mutating values returned from hooks, `try ... finally` in components/hooks, and boilerplate `useMemo`/`useCallback`.
        - Flag duplicated components, hooks, styles, or helpers that already exist in `foundation/ui/` or the capability.

    - path: "{interfaces,app}/**"
      instructions: |
        - Keep business rules out of routes, Start server functions, MCP handlers, and adapters; interfaces compose capabilities, validate transport inputs, resolve the authenticated actor, and bind typed navigation/transport.
        - Ensure capability-owned error mapping, query/cache coordination, and auth/workspace isolation (including `app/local-workspace.config.ts`) remain intact.

    - path: "foundation/**"
      instructions: |
        - Treat changes here as shared contracts across capabilities and interfaces; check backward compatibility for consumers and keep capability-specific domain rules out of `foundation/`.
        - For `foundation/ui/**`, verify accessibility, keyboard interaction, focus restoration, dismissal, and pending-state contracts remain consistent.

    - path: "foundation/db/database/migrations/**"
      instructions: |
        - Check that migrations preserve Merit's database invariants (public-ID functions, deferred foreign keys, content checks, outstanding-review index, audit immutability/authorship triggers, and EUR minor units for money).
        - Flag edits to already-applied migrations or unsafe locking/backfill patterns.

    - path: "**/*.{test,integration,spec}.{ts,tsx}"
      instructions: |
        - Verify tests live at the lowest layer that can observe the behavior (`docs/guides/testing.md`) and assert observable outcomes rather than internal helper calls or call counts.
        - Flag scenarios duplicated at another layer without justification (boundary translation, representative journey, distinct failure mode, or severe regression guarantee like auth/tenant isolation/money/audit).
        - If authorization or revision prerequisites changed, verify all affected integration fixtures (including MCP and cross-capability tests) establish them.
        - Flag arbitrary sleeps/waits where tests should wait on observable readiness.

    - path: "**/*.stories.tsx"
      instructions: |
        - Verify isolated stories match the connected screen's task placement and keep synthetic test controls visibly outside the product frame (`docs/guides/storybook.md`).

    - path: "docs/**"
      instructions: |
        - Maintain documentation as a coherent explanation for its reader (`docs/guides/documentation.md`), keeping current implemented behavior clearly separated from future design.
        - Verify internal links, symbol names, and command references match the current repository.

  tools:
    # Merit runs oxlint, oxfmt, stylelint, and remark in CI; disable redundant or conflicting linters.
    eslint:
      enabled: false
    biome:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    # Complementary checks aligned with Merit's stack:
    oxc:
      enabled: true
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    yamllint:
      enabled: true
    shellcheck:
      enabled: true
    hadolint:
      enabled: true
    squawk:
      enabled: true
    ast-grep:
      enabled: true
    opengrep:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  web_search:
    enabled: true
  learnings:
    scope: auto
  code_guidelines:
    enabled: true
    filePatterns:
      - files: ".agents/skills/build-feature/review.md"
        applyTo: "capabilities/**, interfaces/**, foundation/**, app/**"
      - files: "docs/foundations/architecture.md"
        applyTo: "capabilities/**, interfaces/**, foundation/**, app/**"
      - files: "docs/guides/coding-conventions.md"
        applyTo: "**/*.{ts,tsx,js,mjs}"
      - files: "docs/guides/web-features.md"
        applyTo: "capabilities/*/web/**, interfaces/**"
      - files: "docs/guides/ui.md"
        applyTo: "capabilities/*/web/**, interfaces/**, foundation/ui/**, **/*.tsx, **/*.css"
      - files: "docs/guides/testing.md"
        applyTo: "**/*.test.ts, **/*.test.tsx, **/*.integration.ts, **/*.spec.ts, **/*.stories.tsx"
