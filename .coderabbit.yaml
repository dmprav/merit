# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US
tone_instructions: >
  Be concise and direct. Ground feedback in repository precedents, guides, and
  domain concepts, naming the concrete fix. Do not comment on formatting or
  checks enforced by oxlint, oxfmt, stylelint, remark, fallow, or
  `vp run architecture`.

reviews:
  profile: chill
  # Keep PR descriptions clean because Merit squash-merges them as commit messages.
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  abort_on_close: true

  path_filters:
    - "!**/routeTree.gen.ts"
    - "!pnpm-lock.yaml"
    - "!tooling/storybook/snapshots/**"
    - "!**/dist/**"
    - "!**/coverage/**"

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"

  path_instructions:
    - path: "capabilities/*/business/**"
      instructions: |
        - Keep business rules, authorization predicates, domain invariants, revision/conflict handling, and transaction/lock ordering here rather than in `web/`, `interfaces/`, or `app/`.
        - Keep domain terminology consistent with `docs/domain/concepts.md` and the owning workflow in `docs/workflows/`.
        - Verify persistence commands validate/decode stored JSON projections explicitly and commit audit events inside the owning transaction.
        - Flag abstractions with a single use and no stated requirement, or helpers/fixtures that duplicate existing repository utilities.

    - path: "capabilities/access/**"
      instructions: |
        - Verify authorization changes use current server facts under locks across web and MCP, and check that tenant/workspace isolation cannot be bypassed.
        - After membership removal and restoration, verify pending invitations and accepted assignments remain inaccessible until explicitly reinstated.

    - path: "capabilities/*/web/**"
      instructions: |
        - Enforce `docs/guides/web-features.md` semantic ownership: views present state and invoke controller actions without fetching records or building save commands; controllers own drafts, revision baselines, conflict/recovery, and Undo; `data/` owns transport normalization and cache updates. Do not repeat import-boundary or React Compiler checks already enforced in CI.
        - Flag duplicated components, hooks, styles, or helpers that already exist in `foundation/ui/` or the capability.
        - Verify editing flows follow `foundation/ui/src/patterns/editing/editing.mdx` (passive whole-section editing, preserved reading position, aligned conflict comparisons).

    - path: "{interfaces,app}/**"
      instructions: |
        - Keep business rules out of routes, Start server functions, MCP handlers, and adapters; interfaces compose capabilities, validate transport inputs, resolve the authenticated actor, and bind typed navigation/transport.
        - Ensure MCP tools preserve web capability preconditions, error containment, and auth/workspace isolation (including `app/local-workspace.config.ts`).

    - path: "foundation/**"
      instructions: |
        - Treat changes here as shared contracts across capabilities and interfaces; check backward compatibility and keep capability-specific domain rules out of `foundation/`.
        - For `foundation/ui/**`, verify accessibility, keyboard interaction, popup dismissal on history changes, focus restoration, and compact header reachability.

    - path: "foundation/db/database/migrations/**"
      instructions: |
        - Check that migrations preserve Merit's database invariants (surrogate/public IDs, covering FK indexes, enum `CHECK` constraints, deferred foreign keys, audit immutability/authorship triggers, and EUR minor units for money).
        - Flag edits to already-applied migrations or unsafe locking/backfill patterns.

    - path: "**/*.{test,integration,spec}.{ts,tsx}"
      instructions: |
        - Verify tests live at the lowest layer that can observe the behavior (`docs/guides/testing.md`) and assert observable outcomes rather than internal helper calls or call counts.
        - Flag scenarios duplicated at another layer without justification, or weakened assertions/coverage policy.
        - If authorization or revision prerequisites changed, verify all affected integration fixtures (including MCP and cross-capability journeys) establish them.
        - Flag arbitrary sleeps/waits where tests should wait on observable readiness.

    - path: "**/*.stories.tsx"
      instructions: |
        - Verify isolated stories match the connected screen's task placement and keep synthetic test controls visibly outside the product frame (`docs/guides/storybook.md`).

    - path: "docs/**"
      instructions: |
        - Maintain documentation as a coherent explanation for its reader (`docs/guides/documentation.md`), keeping current implemented behavior clearly separated from future design.
        - Verify internal links, symbol names, and command references match the current repository.

  tools:
    # Merit runs oxlint, oxfmt, stylelint, and remark in CI; disable redundant or conflicting linters.
    eslint:
      enabled: false
    biome:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    # Complementary checks aligned with Merit's stack:
    oxc:
      enabled: true
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    yamllint:
      enabled: true
    shellcheck:
      enabled: true
    hadolint:
      enabled: true
    squawk:
      enabled: true
    ast-grep:
      enabled: true
    opengrep:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  web_search:
    enabled: true
  learnings:
    scope: auto
  code_guidelines:
    enabled: true
    filePatterns:
      - files: ".agents/skills/build-feature/review.md"
        applyTo: "capabilities/**, interfaces/**, foundation/**, app/**"
      - files: "docs/foundations/architecture.md"
        applyTo: "capabilities/**, interfaces/**, foundation/**, app/**"
      - files: "docs/guides/coding-conventions.md"
        applyTo: "**/*.ts, **/*.tsx, **/*.js, **/*.mjs"
      - files: "docs/guides/web-features.md"
        applyTo: "capabilities/*/web/**, interfaces/**"
      - files: "docs/guides/ui.md"
        applyTo: "capabilities/*/web/**, interfaces/**, foundation/ui/**, **/*.tsx, **/*.css"
      - files: "docs/guides/ui-verification.md"
        applyTo: "capabilities/*/web/**, interfaces/**, foundation/ui/**, **/*.stories.tsx"
      - files: "docs/guides/testing.md"
        applyTo: "**/*.test.ts, **/*.test.tsx, **/*.integration.ts, **/*.spec.ts, **/*.stories.tsx"
      - files: "docs/guides/database.md"
        applyTo: "foundation/db/**, **/persistence/schema.ts"
      - files: "capabilities/access/README.md"
        applyTo: "capabilities/access/**, foundation/auth/**, capabilities/*/business/src/server/**"
      - files: "docs/guides/mcp.md"
        applyTo: "interfaces/mcp/**, capabilities/*/ai/**, foundation/ai/**"
      - files: "foundation/ui/src/patterns/editing/editing.mdx"
        applyTo: "foundation/drafts/**, foundation/ui/src/patterns/editing/**, capabilities/*/web/src/controllers/**"
