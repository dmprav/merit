<!-- @dsCard height=288 -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Merit — cover</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--background);
      }
      .cover {
        position: relative;
        width: 960px;
        height: 288px;
        overflow: hidden;
        background: var(--background);
        font-family: var(--font-sans);
      }
      .art {
        position: absolute;
        inset: 0;
        width: 960px;
        height: 288px;
      }
      .tile {
        fill: var(--border);
        rx: var(--control-radius);
      }
      .t-acc {
        fill: var(--action);
      }
      .blk {
        rx: var(--panel-radius);
      }
      .b-act {
        fill: var(--action);
      }
      .b-fg {
        fill: var(--foreground);
      }
      .b-sub {
        fill: var(--action-subtle);
      }
      .b-ok {
        fill: var(--success);
      }
      .text {
        position: absolute;
        left: var(--space-8);
        bottom: var(--space-8);
        max-width: 440px;
      }
      .name {
        margin: 0;
        font-size: 120px;
        line-height: 0.92;
        font-weight: 700;
        letter-spacing: -0.05em;
        color: var(--foreground);
      }
      .tag {
        margin: var(--space-3) 0 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--muted);
      }
    </style>
  </head>
  <body style="padding: 0">
    <div class="cover">
      <svg class="art" viewBox="0 0 960 288" preserveAspectRatio="xMinYMin meet" aria-hidden="true">
        <!--
    blocks: action slab 176x304 (bleeds top/bottom); foreground 136x152; action-subtle 136x112; success 64x64; corners panel-radius
    arrangement: one tall slab at the right edge with satellites stacked to its left, a modular tile field nearest the name
    pattern: tiles cut by control-radius, one merged two-wide — "Dense work reads in three steps"; Merit is a modular, Linear-like work UI
    steps: tile 32 = space-8, gap 8 = space-2, block gaps 8/16 = space-2/space-4; radii control-radius (tiles), panel-radius (blocks)
  -->
        <rect class="tile t" x="488" y="8" width="32" height="32" />
        <rect class="tile t" x="488" y="88" width="32" height="32" />
        <rect class="tile t" x="488" y="128" width="32" height="32" />
        <rect class="tile t" x="488" y="168" width="72" height="32" />
        <rect class="tile t" x="488" y="208" width="32" height="32" />
        <rect class="tile t" x="488" y="248" width="32" height="32" />
        <rect class="tile t" x="528" y="48" width="32" height="32" />
        <rect class="tile t-acc" x="528" y="88" width="32" height="32" />
        <rect class="tile t" x="528" y="208" width="32" height="32" />
        <rect class="tile t" x="568" y="8" width="32" height="32" />
        <rect class="tile t" x="568" y="48" width="32" height="32" />
        <rect class="tile t" x="568" y="128" width="32" height="32" />
        <rect class="tile t" x="568" y="168" width="32" height="32" />
        <rect class="tile t" x="568" y="248" width="32" height="32" />
        <rect class="tile t" x="608" y="8" width="32" height="32" />
        <rect class="tile t" x="608" y="88" width="32" height="32" />
        <rect class="tile t" x="608" y="128" width="32" height="32" />
        <rect class="tile t-acc" x="608" y="208" width="32" height="32" />
        <rect class="tile t" x="608" y="248" width="32" height="32" />
        <rect class="blk b-fg" x="656" y="-16" width="136" height="152" />
        <rect class="blk b-sub" x="656" y="144" width="136" height="112" />
        <rect class="blk b-ok" x="712" y="264" width="64" height="64" />
        <rect class="blk b-act" x="800" y="-16" width="176" height="320" />
      </svg>
      <div class="text">
        <h1 class="name">Merit</h1>
        <p class="tag">Focused grant work: attention, evidence, deliberate decisions.</p>
      </div>
    </div>
  </body>
</html>
