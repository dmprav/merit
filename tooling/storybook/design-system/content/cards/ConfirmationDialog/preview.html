<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ConfirmationDialog — preview</title>
  </head>
  <body>
    <div id="root" style="padding: 16px"></div>
    <script>
      var M = window.Merit,
        h = React.createElement;
      function Demo() {
        var s = React.useState(true),
          open = s[0],
          setOpen = s[1];
        return h(M.ConfirmationDialog, {
          title: "Revoke invitation?",
          description:
            "alex@example.org will no longer be able to join the workspace using this invitation. You can send a new invitation later.",
          closeLabel: "Close dialog",
          cancelLabel: "Keep invitation",
          confirmLabel: "Revoke invitation",
          pendingLabel: "Revoking invitation…",
          intent: "destructive",
          isOpen: open,
          onOpenChange: setOpen,
          onConfirm: function () {
            setOpen(false);
          },
          trigger: h(M.Button, { size: "medium", variant: "secondary" }, "Review revocation"),
        });
      }
      ReactDOM.createRoot(document.getElementById("root")).render(h(M.Provider, null, h(Demo)));
    </script>
  </body>
</html>
