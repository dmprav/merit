<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Toast — preview</title>
  </head>
  <body>
    <div id="root" style="padding: 16px"></div>
    <script>
      var M = window.Merit,
        h = React.createElement;
      function noop() {}
      var examples = {
        saved: { tone: "success", message: "Recommendation saved" },
        undo: {
          tone: "success",
          message: "Criterion removed",
          action: { label: "Undo", onPress: noop },
        },
        refreshFailed: {
          tone: "warning",
          message: "Saved, but the latest round could not be loaded.",
          action: { label: "Refresh", onPress: noop },
        },
        failed: { tone: "danger", message: "The address could not be copied." },
      };
      function Triggers() {
        React.useEffect(function () {
          M.showToast(examples.undo);
          M.showToast(examples.refreshFailed);
          M.showToast(examples.failed);
        }, []);
        return h(
          M.Inline,
          null,
          h(
            M.Button,
            {
              size: "medium",
              onPress: function () {
                M.showToast(examples.saved);
              },
            },
            "Save",
          ),
          h(
            M.Button,
            {
              variant: "secondary",
              size: "medium",
              onPress: function () {
                M.showToast(examples.undo);
              },
            },
            "Remove criterion",
          ),
          h(
            M.Button,
            {
              variant: "secondary",
              size: "medium",
              onPress: function () {
                M.showToast(examples.refreshFailed);
              },
            },
            "Save with a failed refresh",
          ),
          h(
            M.Button,
            {
              variant: "secondary",
              size: "medium",
              onPress: function () {
                M.showToast(examples.failed);
              },
            },
            "Copy address",
          ),
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(
        h(M.Provider, null, h(Triggers, null), h(M.Toasts, null)),
      );
    </script>
  </body>
</html>
