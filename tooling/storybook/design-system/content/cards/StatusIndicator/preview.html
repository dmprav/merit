<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>StatusIndicator — preview</title>
  </head>
  <body>
    <div id="root" style="padding: 16px; max-width: 440px"></div>
    <script>
      var M = window.Merit,
        h = React.createElement;
      ReactDOM.createRoot(document.getElementById("root")).render(
        h(
          M.Provider,
          null,
          h(
            M.Stack,
            { gap: 4 },
            h(
              M.DescriptionList,
              { layout: "rows" },
              h(
                M.DescriptionListItem,
                { label: "Recommendation" },
                h(
                  M.Inline,
                  { gap: 1 },
                  "Fund in full",
                  h(M.StatusIndicator, {
                    label: "Earlier recommendation",
                    explanation:
                      "This recommendation was prepared for an earlier application version.",
                  }),
                ),
              ),
              h(
                M.DescriptionListItem,
                { label: "Review progress" },
                h(
                  M.Inline,
                  { gap: 1 },
                  "2 of 3 reviews",
                  h(M.StatusIndicator, {
                    tone: "muted",
                    label: "Reviewer reassigned",
                    explanation:
                      "One reviewer was replaced after declaring a conflict of interest.",
                  }),
                ),
              ),
            ),
            h(
              M.DescriptionList,
              { layout: "figures" },
              h(
                M.DescriptionListItem,
                { label: "Requested" },
                h(
                  M.Inline,
                  { gap: 1 },
                  "£12,400",
                  h(M.StatusIndicator, {
                    label: "Amount changed",
                    explanation: "The applicant changed this amount after the review started.",
                  }),
                ),
              ),
              h(
                M.DescriptionListItem,
                { label: "Recommended" },
                h(M.Inline, { gap: 1 }, "£10,000", h(M.StatusIndicatorSpace, null)),
              ),
            ),
          ),
        ),
      );
    </script>
  </body>
</html>
