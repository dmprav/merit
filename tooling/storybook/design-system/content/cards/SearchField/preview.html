<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SearchField — preview</title>
  </head>
  <body>
    <div id="root" style="padding: 16px"></div>
    <script>
      var M = window.Merit,
        h = React.createElement;
      function Search(props) {
        var s = React.useState(props.initial),
          value = s[0],
          setValue = s[1];
        return h(
          M.SearchField,
          Object.assign(
            {
              label: "Search applications",
              clearLabel: "Clear search",
              placeholder: "Application or applicant",
              value: value,
              onChange: setValue,
            },
            props.extra,
          ),
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(
        h(
          M.Provider,
          null,
          h(
            "div",
            { style: { maxWidth: "448px" } },
            h(
              M.Stack,
              { gap: 4 },
              h(
                M.Stack,
                { gap: 2 },
                h(M.Text, { as: "p", variant: "caption" }, "Empty"),
                h(Search, { initial: "" }),
              ),
              h(
                M.Stack,
                { gap: 2 },
                h(M.Text, { as: "p", variant: "caption" }, "Populated, with clear"),
                h(Search, { initial: "Neighbourhood" }),
              ),
              h(
                M.Stack,
                { gap: 2 },
                h(M.Text, { as: "p", variant: "caption" }, "Disabled"),
                h(Search, { initial: "Neighbourhood", extra: { isDisabled: true } }),
              ),
            ),
          ),
        ),
      );
    </script>
  </body>
</html>
