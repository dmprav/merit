<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Calendar — preview</title>
  </head>
  <body>
    <div id="root" style="padding: 16px"></div>
    <script>
      var M = window.Merit,
        h = React.createElement;
      function Example(props) {
        var s = React.useState(props.value),
          value = s[0],
          set = s[1];
        return h(M.Calendar, {
          label: props.label,
          value: value,
          onChange: set,
          isDisabled: props.isDisabled,
        });
      }
      ReactDOM.createRoot(document.getElementById("root")).render(
        h(
          M.Provider,
          null,
          h(
            M.Inline,
            { gap: 6, align: "start" },
            h(
              "div",
              { style: { width: "300px" } },
              h(Example, { label: "Committee date", value: "2027-01-21" }),
            ),
            h(
              "div",
              { style: { width: "300px" } },
              h(Example, { label: "Decision date", value: "2027-01-21", isDisabled: true }),
            ),
          ),
        ),
      );
    </script>
  </body>
</html>
