<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Badge — preview</title>
  </head>
  <body>
    <div id="root" style="padding: 16px"></div>
    <script>
      var M = window.Merit,
        h = React.createElement;
      ReactDOM.createRoot(document.getElementById("root")).render(
        h(
          M.Provider,
          null,
          h(
            M.Stack,
            { gap: 5 },
            h(
              M.Inline,
              null,
              h(M.Badge, null, "Draft"),
              h(M.Badge, { tone: "success" }, "Current"),
              h(M.Badge, { tone: "warning" }, "Outdated"),
              h(M.Badge, { tone: "danger" }, "Failed"),
            ),
            h(
              M.Stack,
              { gap: 3 },
              h(M.Badge, { appearance: "plain", icon: "clock" }, "Awaiting acceptance"),
              h(M.Badge, { appearance: "plain", tone: "success" }, "Accepted"),
              h(M.Badge, { appearance: "plain", tone: "warning" }, "Sending unconfirmed"),
              h(M.Badge, { appearance: "plain", tone: "danger" }, "Email sending failed"),
            ),
            h(
              "div",
              { style: { maxWidth: "200px" } },
              h(
                M.Stack,
                { gap: 2 },
                h(M.Badge, null, "Not accepted"),
                h(M.Badge, { tone: "warning" }, "Application changed since this review"),
              ),
            ),
          ),
        ),
      );
    </script>
  </body>
</html>
