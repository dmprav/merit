<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MoneyField — preview</title>
  </head>
  <body>
    <div id="root" style="padding: 16px"></div>
    <script>
      var M = window.Merit,
        h = React.createElement;
      function Amount(props) {
        var s = React.useState(props.initial),
          value = s[0],
          setValue = s[1];
        return h(
          M.MoneyField,
          Object.assign(
            {
              label: "Proposed allocation",
              prefix: { text: "€", label: "Euros" },
              precisionMessage: "Use numbers with up to two decimal places.",
              value: value,
              onChange: setValue,
            },
            props.extra,
          ),
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(
        h(
          M.Provider,
          null,
          h(
            "div",
            { style: { maxWidth: "448px" } },
            h(
              M.Stack,
              { gap: 4 },
              h(Amount, { initial: "" }),
              h(Amount, {
                initial: "12500.50",
                extra: { description: "Enter the amount in euros." },
              }),
              h(Amount, {
                initial: "123.456",
                extra: { isInvalid: true, errorMessage: "Enter at most two decimal places." },
              }),
              h(Amount, { initial: "20000.00", extra: { isReadOnly: true } }),
            ),
          ),
        ),
      );
    </script>
  </body>
</html>
