services:
  mailpit:
    image: axllent/mailpit:v1.30.4
    ports:
      - "127.0.0.1:8025:8025"
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: merit
      POSTGRES_PASSWORD: merit
      POSTGRES_DB: merit
    volumes:
      - merit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merit -d merit"]
      interval: 2s
      timeout: 5s
      retries: 10
volumes:
  merit-postgres:
