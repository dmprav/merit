services:
  mailpit:
    image: axllent/mailpit:v1.30.4@sha256:5a49a77c5bdbe7c5474450b4f46348d09949df3695257729c93a30369382d4f6
    ports:
      - "127.0.0.1:8025:8025"
  postgres:
    image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: merit
      POSTGRES_PASSWORD: merit
      POSTGRES_DB: merit
    volumes:
      - merit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merit -d merit"]
      interval: 2s
      timeout: 5s
      retries: 10
volumes:
  merit-postgres:
