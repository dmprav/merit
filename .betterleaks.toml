title = "Merit secret scanning"
betterleaksMinVersion = "1.10.0"

# Public credentials for the loopback-only Compose database, plus exact test fixtures.
# Match values as well as context so other credentials in these files still fail.
filter = '''
(
  finding["rule_id"] == "generic-credential-uri" &&
  filter.matchesAny(finding["match"], [`^postgres://merit:merit@127\.0\.0\.1:55432/merit(?:["'\s]|$)`])
) || (
  finding["rule_id"] == "generic-password" &&
  filter.matchesAny(attributes["path"], [`^(?:\./)?compose\.yaml$`]) &&
  finding["secret"] == "merit"
) || (
  finding["rule_id"] == "generic-credential-uri" &&
  filter.matchesAny(attributes["path"], [`^(?:\./)?tooling/(?:scripts/reset-db|verification/secrets)\.test\.ts$`]) &&
  filter.matchesAny(finding["match"], [`^postgres://example:example@remote\.invalid/production(?:["'\s]|$)`])
) || (
  finding["rule_id"] == "generic-api-key" &&
  filter.matchesAny(attributes["path"], [`^(?:\./)?(?:app/tests/browser/workspace\.playwright\.config|tooling/verification/secrets\.test)\.ts$`]) &&
  finding["secret"] == "pk_test_Y2xlcmsuZXhhbXBsZSQ="
)
'''

[extend]
useDefault = true
